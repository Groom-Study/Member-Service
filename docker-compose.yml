services:

  db:
    image: mysql:8.0
    container_name: authservice-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: authservice
      MYSQL_USER: authuser
      MYSQL_PASSWORD: authpass
      MYSQL_AUTHENTICATION_PLUGIN: caching_sha2_password
    command: --default-authentication-plugin=caching_sha2_password
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uauthuser", "-pauthpass"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: authservice-app
    restart: on-failure
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/authservice?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&serverTimezone=Asia/Seoul
      SPRING_DATASOURCE_USERNAME: authuser
      SPRING_DATASOURCE_PASSWORD: authpass

volumes:
  mysql-data: