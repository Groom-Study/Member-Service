<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <title>회원가입</title>
    <link rel="stylesheet" th:href="@{/css/common.css}" />
</head>
<body>
<div class="page-center">
    <div class="card">
        <h2 class="card-title">회원가입</h2>

        <div class="alert alert-error" th:if="${errorMsg}" th:text="${errorMsg}"></div>

        <form th:action="@{/register}" th:object="${registerDto}" method="post">
            <div class="form-group">
                <label for="username">아이디</label>
                <input type="text" id="username" th:field="*{username}" placeholder="아이디를 입력하세요" maxlength="20" />
                <p class="form-hint">영문, 숫자 조합 4~20자</p>
            </div>
            <div class="form-group">
                <label for="name">이름</label>
                <input type="text" id="name" th:field="*{name}" placeholder="이름을 입력하세요" maxlength="20" />
            </div>
            <div class="form-group">
                <label for="password">비밀번호</label>
                <input type="password" id="password" th:field="*{password}" placeholder="비밀번호를 입력하세요" maxlength="30" />
                <p class="form-hint">4~30자</p>
            </div>
            <div class="form-group">
                <label for="passwordConfirm">비밀번호 확인</label>
                <input type="password" id="passwordConfirm" th:field="*{passwordConfirm}" placeholder="비밀번호를 다시 입력하세요" maxlength="30" />
            </div>
            <button type="submit" class="btn-primary">가입하기</button>
        </form>

        <hr class="divider" />
        <p class="footer-link">이미 계정이 있으신가요? <a th:href="@{/login}">로그인</a></p>
    </div>
</div>
</body>
</html>
