<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <title>로그인</title>
    <link rel="stylesheet" th:href="@{/css/common.css}" />
</head>
<body>
<div class="page-center">
    <div class="card">
        <h2 class="card-title">로그인</h2>

        <div class="alert alert-success" th:if="${param.registered}">
            회원가입이 완료되었습니다! 로그인해주세요.
        </div>
        <div class="alert alert-error" th:if="${errorMsg}" th:text="${errorMsg}"></div>

        <form th:action="@{/login}" th:object="${loginDto}" method="post">
            <div class="form-group">
                <label for="username">아이디</label>
                <input type="text" id="username" th:field="*{username}" placeholder="아이디를 입력하세요" />
            </div>
            <div class="form-group">
                <label for="password">비밀번호</label>
                <input type="password" id="password" th:field="*{password}" placeholder="비밀번호를 입력하세요" />
            </div>
            <button type="submit" class="btn-primary">로그인</button>
        </form>

        <hr class="divider" />
        <p class="footer-link">아직 계정이 없으신가요? <a th:href="@{/register}">회원가입</a></p>
    </div>
</div>
</body>
</html>
