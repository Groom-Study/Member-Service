<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <title>회원 목록</title>
    <link rel="stylesheet" th:href="@{/css/common.css}" />
</head>
<body>
<div class="table-page">
    <div class="table-header">
        <h2>👥 회원 목록</h2>
        <a th:href="@{/admin/}" class="btn-back">← 돌아가기</a>
    </div>

    <div class="table-wrapper">
        <table>
            <thead>
                <tr>
                    <th>No</th>
                    <th>아이디</th>
                    <th>이름</th>
                    <th>역할</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="member, stat : ${members}">
                    <td th:text="${stat.count}"></td>
                    <td th:text="${member.username}"></td>
                    <td th:text="${member.name}"></td>
                    <td>
                        <span th:if="${member.role.name() == 'ADMIN'}" class="role-badge admin">관리자</span>
                        <span th:if="${member.role.name() == 'USER'}"  class="role-badge user">일반회원</span>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
